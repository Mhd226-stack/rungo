name: flutter_user
description: A new Flutter project.
publish_to: "none"

version: 2.0.0+13

environment:
  sdk: ">=2.18.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  google_fonts: ^8.0.2
  http: ^1.1.0
  firebase_auth: ^6.3.0
  firebase_core: ^4.6.0
  firebase_database: ^12.2.0
  firebase_messaging: ^16.1.3
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  google_maps_flutter: ^2.5.0
  geolocator: ^14.0.2
  location: ^8.0.1
  audioplayers: ^6.0.0
  url_launcher: ^6.2.4
  flutter_local_notifications: ^21.0.0
  permission_handler: ^12.0.1
  share_plus: ^12.0.2
  connectivity_plus: ^7.1.0
  package_info_plus: ^9.0.1
  vector_math: ^2.1.4
  webview_flutter: ^4.4.2
  path_provider: ^2.1.2
  flutter_inappwebview: ^6.0.0
  uuid: ^4.3.3
  device_info_plus: ^12.4.0
  pinput: ^6.0.2
  intl: ^0.20.2
  geocoding: ^4.0.0
  agora_rtc_engine: ^6.3.0
  agora_token_service: ^0.1.2
  flutter_ringtone_player: ^4.0.0
  lottie: ^3.1.0
  flutter_advanced_switch: ^3.1.0
  font_awesome_flutter: ^11.0.0
  flutter_contacts: ^1.1.9+1
  dio: ^5.3.2
  app_links: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logoo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFB800"
  adaptive_icon_foreground: "assets/images/logoo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/nav/
    - assets/audio/
    - assets/map_style_black.json
    - assets/dark.json
    - assets/images/Pick_icon.png